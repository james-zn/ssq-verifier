<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双色球开奖验证</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        .header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            padding: 20px 16px 30px;
            color: white;
            text-align: center;
        }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .card {
            background: white;
            border-radius: 12px;
            margin: -15px 12px 12px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: relative;
            z-index: 1;
        }
        .card + .card { margin-top: 12px; }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 近5期开奖结果 */
        .history-list { margin-top: 10px; }
        .history-item {
            display: flex; align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .history-item:last-child { border-bottom: none; }
        .history-period {
            font-size: 13px; color: #666;
            min-width: 70px;
        }
        .history-period .num { font-weight: 700; color: #e74c3c; }
        .history-balls {
            display: flex; gap: 4px; flex-wrap: wrap;
            flex: 1; justify-content: flex-end;
        }
        .history-ball {
            width: 26px; height: 26px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: white;
        }
        .history-ball.red { background: linear-gradient(135deg, #ff4757, #e74c3c); }
        .history-ball.blue { background: linear-gradient(135deg, #1e90ff, #0984e3); }

        .balls-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .ball {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700; color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .ball.red { background: linear-gradient(135deg, #ff4757, #e74c3c); }
        .ball.blue { background: linear-gradient(135deg, #1e90ff, #0984e3); }
        .ball.small { width: 34px; height: 34px; font-size: 14px; }
        .ball.highlight { animation: glow 1.5s ease-in-out infinite alternate; }
        @keyframes glow {
            from { box-shadow: 0 0 4px rgba(255,215,0,0.4); }
            to { box-shadow: 0 0 16px rgba(255,215,0,0.9); }
        }

        /* 拍照区域 */
        .camera-section { position: relative; margin-bottom: 12px; }
        .camera-preview {
            width: 100%; height: 200px;
            border-radius: 10px;
            background: #f0f0f0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .camera-preview video, .camera-preview canvas, .camera-preview img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .camera-placeholder { text-align: center; color: #aaa; }
        .camera-placeholder .icon { font-size: 48px; margin-bottom: 8px; }
        .camera-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px dashed #e74c3c;
            width: 80%; height: 60px;
            border-radius: 8px; pointer-events: none;
        }
        .camera-hint { text-align: center; font-size: 12px; color: #999; margin-top: 8px; }

        /* 按钮 */
        .camera-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-camera {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-start { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .btn-capture { background: linear-gradient(135deg, #1e90ff, #0984e3); color: white; }
        .btn-retake { background: #f0f0f0; color: #666; }
        .btn-upload { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; }
        input[type="file"] { display: none; }

        /* OCR状态 */
        .ocr-status { text-align: center; padding: 16px; display: none; }
        .ocr-status.show { display: block; }
        .ocr-loading {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid #f0f0f0; border-top-color: #e74c3c;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 识别结果 - 多注号码列表 */
        .recognize-result {
            background: #f8f9fa; border-radius: 10px;
            padding: 12px; margin-top: 12px; display: none;
        }
        .recognize-result.show { display: block; }
        .recognize-title { font-size: 13px; color: #666; margin-bottom: 8px; }
        .recognize-period {
            font-size: 14px; color: #e74c3c; font-weight: 700;
            margin-bottom: 10px; text-align: center;
            background: #fff5f5; padding: 6px 12px; border-radius: 8px;
        }
        .ticket-list { margin-top: 8px; }
        .ticket-item {
            background: white; border-radius: 8px; padding: 10px;
            margin-bottom: 8px; border: 1px solid #eee;
        }
        .ticket-item:last-child { margin-bottom: 0; }
        .ticket-header {
            font-size: 12px; color: #999; margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .ticket-header .ticket-index {
            background: #e74c3c; color: white; font-size: 11px;
            padding: 1px 8px; border-radius: 10px; font-weight: 600;
        }
        .ticket-balls {
            display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
        }
        .ticket-balls .ball { width: 32px; height: 32px; font-size: 13px; }
        .ticket-balls .separator {
            width: 20px; text-align: center; color: #ccc; font-size: 14px; font-weight: 700;
        }

        /* 输入区 */
        .input-section { margin-top: 8px; }
        .input-label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .red-inputs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .red-inputs input, .blue-input-wrap input {
            width: 100%; height: 46px;
            border: 2px solid #eee; border-radius: 10px;
            text-align: center; font-size: 18px; font-weight: 700;
            color: #e74c3c; background: #fafafa; outline: none;
        }
        .red-inputs input:focus { border-color: #e74c3c; background: #fff; }
        .blue-input-wrap { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
        .blue-input-wrap input { width: 70px; color: #1e90ff; }
        .blue-input-wrap input:focus { border-color: #1e90ff; background: #fff; }
        .blue-input-wrap span { font-size: 13px; color: #888; }

        /* 主按钮 */
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 14px;
        }
        .btn-red { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .btn-green { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; }
        .btn:active { opacity: 0.8; }

        /* 结果卡片 */
        .result-card {
            margin-top: 12px; border-radius: 12px;
            padding: 20px 16px; text-align: center; display: none;
        }
        .result-card.show { display: block; }
        .result-card.win {
            background: linear-gradient(135deg, #fff8e1, #fff3cd);
            border: 1px solid #ffc107;
        }
        .result-card.lose { background: #f8f9fa; border: 1px solid #e9ecef; }
        .result-icon { font-size: 40px; margin-bottom: 8px; }
        .result-title { font-size: 22px; font-weight: 700; }
        .result-period-info {
            font-size: 13px; color: #666;
            margin-bottom: 8px;
        }
        .result-period-info .period-num {
            color: #e74c3c; font-weight: 700;
        }
        .result-money { font-size: 15px; color: #e67e22; margin-top: 4px; }
        .result-detail { font-size: 13px; color: #888; margin-top: 10px; }
        .compare { display: flex; justify-content: space-around; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #ddd; }
        .compare-item { text-align: center; }
        .compare-label { font-size: 12px; color: #aaa; margin-bottom: 6px; }

        /* 多注验证结果汇总 */
        .verify-summary {
            background: white; border-radius: 10px; padding: 14px;
            margin-top: 12px; border: 1px solid #eee; display: none;
        }
        .verify-summary.show { display: block; }
        .verify-summary-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
        .verify-summary-title { font-size: 15px; font-weight: 700; color: #333; }
        .verify-summary-stats { font-size: 13px; color: #666; }
        .verify-summary-stats .win-count { color: #e74c3c; font-weight: 700; }
        .verify-ticket-result {
            background: #f8f9fa; border-radius: 8px; padding: 10px;
            margin-bottom: 8px; border-left: 4px solid #ddd;
        }
        .verify-ticket-result:last-child { margin-bottom: 0; }
        .verify-ticket-result.is-win {
            background: linear-gradient(135deg, #fff8e1, #fffdf0);
            border-left-color: #ffc107;
        }
        .verify-ticket-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px;
        }
        .verify-ticket-label { font-size: 12px; color: #999; }
        .verify-ticket-prize { font-size: 13px; font-weight: 700; }
        .verify-ticket-prize.win-prize { color: #e67e22; }
        .verify-ticket-prize.lose-prize { color: #bbb; }
        .verify-ticket-balls {
            display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
        }
        .verify-ticket-balls .ball { width: 28px; height: 28px; font-size: 11px; }
        .verify-ticket-balls .sep { color: #ccc; font-size: 12px; margin: 0 2px; }
        .verify-ticket-match {
            font-size: 11px; color: #999; margin-top: 4px;
        }
        .verify-ticket-match b { color: #e74c3c; }

        /* 规则 */
        .rules { font-size: 12px; color: #999; line-height: 2; }
        .rules div { display: flex; align-items: center; gap: 4px; }
        .rules .prize-name { color: #e74c3c; font-weight: 600; min-width: 50px; }

        /* 加载 */
        .loading { text-align: center; padding: 20px; color: #ccc; }
        .loading::after {
            content: ''; display: inline-block; width: 16px; height: 16px;
            border: 2px solid #ddd; border-top-color: #e74c3c;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-left: 6px; vertical-align: middle;
        }

        /* Tab切换 */
        .tab-bar { display: flex; background: white; padding: 0 12px; position: relative; z-index: 2; }
        .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; color: #999; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab.active { color: #e74c3c; border-bottom-color: #e74c3c; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .footer { text-align: center; font-size: 11px; color: #ccc; margin-top: 20px; padding: 10px; }

        .edit-btn { font-size: 12px; color: #1e90ff; cursor: pointer; text-align: center; margin-top: 6px; }

        .toast {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75); color: white;
            padding: 12px 24px; border-radius: 8px;
            font-size: 14px; z-index: 1000; display: none;
        }
        .toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -60%); } }

        .auto-badge {
            display: inline-block;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>双色球开奖验证</h1>
    <p>拍照识别 · 自动匹配 · 一键验证</p>
</div>

<!-- Tab导航 -->
<div class="tab-bar">
    <div class="tab active" onclick="switchTab('camera')">拍照识别<span class="auto-badge">智能</span></div>
    <div class="tab" onclick="switchTab('manual')">手动输入</div>
</div>

<!-- ==================== 拍照识别 ==================== -->
<div id="cameraTab" class="tab-content active">
    <!-- 近5期开奖结果 -->
    <div class="card">
        <div class="section-title">近5期开奖结果</div>
        <div id="historyResult">
            <div class="loading">正在加载开奖数据</div>
        </div>
    </div>

    <!-- 拍照区域 -->
    <div class="card">
        <div class="section-title">拍摄彩票</div>

        <div class="camera-section">
            <div class="camera-preview" id="cameraPreview">
                <div class="camera-placeholder" id="cameraPlaceholder">
                    <div class="icon">📸</div>
                    <div>点击下方按钮拍摄彩票</div>
                </div>
                <video id="video" autoplay playsinline style="display:none;"></video>
                <canvas id="canvas" style="display:none;"></canvas>
                <img id="photoPreview" style="display:none;">
                <div class="camera-overlay" id="cameraOverlay" style="display:none;"></div>
            </div>
            <div class="camera-hint">拍摄彩票，系统会自动识别期号和号码（支持多注）</div>
        </div>

        <div class="camera-btn-row" id="btnRow1">
            <button class="btn-camera btn-start" onclick="startCamera()">📷 打开相机</button>
            <label class="btn-camera btn-upload">
                📤 从相册选择
                <input type="file" accept="image/*" onchange="selectFromAlbum(this)">
            </label>
        </div>

        <div class="camera-btn-row" id="btnRow2" style="display:none;">
            <button class="btn-camera btn-capture" onclick="capturePhoto()">拍照</button>
            <button class="btn-camera btn-retake" onclick="retake()">重拍</button>
        </div>

        <!-- OCR加载状态 -->
        <div class="ocr-status" id="ocrStatus">
            <span class="ocr-loading"></span>
            <span id="ocrText">正在识别彩票信息...</span>
        </div>

        <!-- 识别结果 - 多注号码列表 -->
        <div class="recognize-result" id="recognizeResult">
            <div class="recognize-title">识别到的号码</div>
            <div class="recognize-period" id="recognizePeriod"></div>
            <div class="ticket-list" id="recognizeTicketList"></div>
            <div class="edit-btn" onclick="editRecognized()">号码有误？点此修正</div>
        </div>

        <button class="btn btn-green" id="autoVerifyBtn" onclick="autoVerify()" disabled>自动验证中奖</button>

        <!-- 多注验证结果汇总 -->
        <div id="verifySummary" class="verify-summary"></div>

        <!-- 单注结果卡片（兼容手动输入） -->
        <div id="resultCard" class="result-card"></div>
    </div>
</div>

<!-- ==================== 手动输入 ==================== -->
<div id="manualTab" class="tab-content">
    <!-- 近5期开奖结果 -->
    <div class="card">
        <div class="section-title">近5期开奖结果</div>
        <div id="historyResult2">
            <div class="loading">正在加载开奖数据</div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">输入您的号码</div>
        <div class="input-section">
            <div class="input-label">红球（6个，范围 01-33）</div>
            <div class="red-inputs">
                <input type="number" id="r1" min="1" max="33" placeholder="01" inputmode="numeric">
                <input type="number" id="r2" min="1" max="33" placeholder="02" inputmode="numeric">
                <input type="number" id="r3" min="1" max="33" placeholder="03" inputmode="numeric">
                <input type="number" id="r4" min="1" max="33" placeholder="04" inputmode="numeric">
                <input type="number" id="r5" min="1" max="33" placeholder="05" inputmode="numeric">
                <input type="number" id="r6" min="1" max="33" placeholder="06" inputmode="numeric">
            </div>
            <div class="blue-input-wrap">
                <span>蓝球（01-16）</span>
                <input type="number" id="blue" min="1" max="16" placeholder="01" inputmode="numeric">
            </div>
        </div>
        <button class="btn btn-red" onclick="verifyManual()">验证中奖</button>
        <div id="resultCard2" class="result-card"></div>
    </div>
</div>

<!-- 中奖规则 -->
<div class="card">
    <div class="section-title">中奖规则</div>
    <div class="rules">
        <div><span class="prize-name">一等奖</span> 6红+1蓝</div>
        <div><span class="prize-name">二等奖</span> 6红+0蓝</div>
        <div><span class="prize-name">三等奖</span> 5红+1蓝</div>
        <div><span class="prize-name">四等奖</span> 5红+0蓝 或 4红+1蓝</div>
        <div><span class="prize-name">五等奖</span> 4红+0蓝 或 3红+1蓝</div>
        <div><span class="prize-name">六等奖</span> 有蓝球即中</div>
    </div>
</div>

<div class="footer">数据仅供参考，请以官方公布为准 · 理性购彩</div>

    // ========== 获取开奖结果（支持实时同步） ==========
    var API_URL = 'http://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=50';
    var dataSynced = false;

    // 从官方API同步最新数据到本地缓存
    async function syncLatestData() {
        try {
            var resp = await fetch(API_URL, {
                headers: { 'Accept': 'application/json' }
            });
            if (resp.ok) {
                var data = await resp.json();
                if (data.state === 0 && data.result && data.result.length > 0) {
                    var updated = 0;
                    data.result.forEach(function(r) {
                        if (!lotteryHistory[r.code]) {
                            var dateStr = r.date ? r.date.replace(/[()一二三四五六日]/g, '').trim() : '';
                            lotteryHistory[r.code] = {
                                red: r.red.split(','),
                                blue: r.blue,
                                date: dateStr
                            };
                            updated++;
                        }
                    });
                    if (updated > 0) {
                        // 重新渲染历史
                        renderHistory('historyResult');
                        renderHistory('historyResult2');
                    }
                    dataSynced = true;
                }
            }
        } catch(e) {
            // 网络不可用时静默使用内置数据
        }
    }

    async function fetchResult(period) {
        // 优先使用内置数据
        if (period && lotteryHistory[period]) {
            currentResult = { period: period, red: lotteryHistory[period].red.slice(), blue: lotteryHistory[period].blue };
            return currentResult;
        }
        // 尝试从API获取
        try {
            var resp = await fetch(API_URL, {
                headers: { 'Accept': 'application/json' }
            });
            if (resp.ok) {
                var data = await resp.json();
                if (data.state === 0 && data.result && data.result.length > 0) {
                    // 同步所有数据到本地
                    data.result.forEach(function(r) {
                        var dateStr = r.date ? r.date.replace(/[()一二三四五六日]/g, '').trim() : '';
                        lotteryHistory[r.code] = {
                            red: r.red.split(','),
                            blue: r.blue,
                            date: dateStr
                        };
                    });
                    // 如果指定了期号，查找该期
                    if (period && lotteryHistory[period]) {
                        currentResult = { period: period, red: lotteryHistory[period].red.slice(), blue: lotteryHistory[period].blue };
                    } else {
                        var latest = data.result[0];
                        currentResult = { period: latest.code, red: latest.red.split(','), blue: latest.blue };
                    }
                    // 刷新历史显示
                    renderHistory('historyResult');
                    renderHistory('historyResult2');
                    return currentResult;
                }
            }
        } catch(e) {}
        // 最终回退到内置数据最新期
        var latestPeriod = getRecentPeriods(1)[0];
        currentResult = { period: latestPeriod, red: lotteryHistory[latestPeriod].red.slice(), blue: lotteryHistory[latestPeriod].blue };
        return currentResult;
    }

    // ========== OCR识别入口 ==========
    async function runSmartOCR(imageData) {
        var ocrStatus = document.getElementById('ocrStatus');
        var ocrText = document.getElementById('ocrText');
        ocrText.textContent = '正在识别彩票信息...';
        ocrStatus.classList.add('show');
        document.getElementById('recognizeResult').classList.remove('show');
        document.getElementById('autoVerifyBtn').disabled = true;
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('verifySummary').classList.remove('show');

        try {
            var result = await Tesseract.recognize(imageData, 'chi_sim+eng', {
                logger: function(m) {
                    if (m.status === 'recognizing text') {
                        ocrText.textContent = '识别中 ' + Math.round(m.progress * 100) + '%';
                    }
                }
            });
            var text = result.data.text;

            // 提取期号
            detectedPeriod = extractPeriod(text);

            // 提取多注号码
            recognizedTickets = extractAllTickets(text);

            // 如果结构化提取失败，回退到旧逻辑（提取单注）
            if (recognizedTickets.length === 0) {
                var fallback = extractNumbersFallback(text);
                if (fallback.red.length === 6 && fallback.blue) {
                    recognizedTickets = [fallback];
                }
            }

            ocrStatus.classList.remove('show');

            if (recognizedTickets.length === 0) {
                showToast('未能识别到有效号码，请尝试手动输入');
                return;
            }

            await fetchResult(detectedPeriod);

            // 显示识别结果
            document.getElementById('recognizeResult').classList.add('show');

            // 显示期号
            var periodHtml = '';
            if (detectedPeriod) {
                periodHtml = '期号：' + detectedPeriod;
            } else {
                periodHtml = '期号：未识别到（将使用最新期号验证）';
            }
            document.getElementById('recognizePeriod').textContent = periodHtml;

            // 显示多注号码列表
            var ticketsHtml = '';
            recognizedTickets.forEach(function(ticket, idx) {
                ticketsHtml += '<div class="ticket-item">';
                ticketsHtml += '<div class="ticket-header"><span class="ticket-index">第' + (idx + 1) + '注</span></div>';
                ticketsHtml += '<div class="ticket-balls">';
                ticket.red.forEach(function(n) {
                    ticketsHtml += '<div class="ball red">' + n + '</div>';
                });
                ticketsHtml += '<div class="separator">—</div>';
                ticketsHtml += '<div class="ball blue">' + ticket.blue + '</div>';
                ticketsHtml += '</div></div>';
            });
            document.getElementById('recognizeTicketList').innerHTML = ticketsHtml;

            document.getElementById('autoVerifyBtn').disabled = false;
        } catch(err) {
            ocrStatus.classList.remove('show');
            showToast('识别失败，请尝试手动输入');
        }
    }

    // ========== 期号识别 ==========
    function extractPeriod(text) {
        // 优先匹配 "期号:" 或 "期号：" 后面的7位数字
        var match1 = text.match(/期号[：:]\s*(\d{7})/);
        if (match1) return match1[1];

        // 其次匹配 "期" 字后面的7位数字
        var match2 = text.match(/期\s*(\d{7})/);
        if (match2) return match2[1];

        // 再其次匹配任何20开头的7位数字
        var match3 = text.match(/\b(20\d{5})\b/);
        if (match3) return match3[1];

        // 兼容：第XXXX年 第XX期 格式
        var match4 = text.match(/(\d{4})\s*年\s*(\d{2,3})\s*期/);
        if (match4) {
            return match4[1] + match4[2].padStart(3, '0');
        }

        // 兼容：第XXXXXXXX期 格式
        var match5 = text.match(/第\s*(\d{7})\s*期/);
        if (match5) return match5[1];

        return '';
    }

    // ========== 多注号码识别（核心改进） ==========
    function extractAllTickets(text) {
        var tickets = [];
        var lines = text.split('\n');

        // 标准格式正则：6个两位数 + 分隔符 + 1个两位数
        // 支持 "XX XX XX XX XX XX — XX" 或 "XX XX XX XX XX XX - XX" 等变体
        // 忽略 [N倍] 等倍数标记
        var ticketPattern = /(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s*[—\-–]+\s*(\d{2})/;

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;

            var match = line.match(ticketPattern);
            if (match) {
                var reds = [match[1], match[2], match[3], match[4], match[5], match[6]];
                var blue = match[7];

                // 验证红球范围 01-33
                var validRed = true;
                for (var r = 0; r < reds.length; r++) {
                    var rn = parseInt(reds[r]);
                    if (rn < 1 || rn > 33) { validRed = false; break; }
                }
                // 验证蓝球范围 01-16
                var bn = parseInt(blue);
                if (bn < 1 || bn > 16) validRed = false;

                if (validRed) {
                    tickets.push({ red: reds, blue: blue });
                }
            }
        }

        // 如果按行没匹配到，尝试在整个文本中用全局匹配
        if (tickets.length === 0) {
            // OCR可能把多行识别为一行，尝试用更宽松的方式匹配
            // 去掉换行符后重新匹配
            var flatText = text.replace(/\n/g, ' ').replace(/\r/g, ' ');
            var globalPattern = /(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s*[—\-–]+\s*(\d{2})/g;
            var m;
            while ((m = globalPattern.exec(flatText)) !== null) {
                var reds2 = [m[1], m[2], m[3], m[4], m[5], m[6]];
                var blue2 = m[7];
                var valid2 = true;
                for (var r2 = 0; r2 < reds2.length; r2++) {
                    var rn2 = parseInt(reds2[r2]);
                    if (rn2 < 1 || rn2 > 33) { valid2 = false; break; }
                }
                var bn2 = parseInt(blue2);
                if (bn2 < 1 || bn2 > 16) valid2 = false;
                if (valid2) {
                    tickets.push({ red: reds2, blue: blue2 });
                }
            }
        }

        return tickets;
    }

    // ========== 旧版号码提取（回退方案） ==========
    function extractNumbersFallback(text) {
        var allNums = text.match(/\b(\d{1,2})\b/g) || [];
        var nums = allNums.map(function(n) { return parseInt(n); });
        var red = [];
        for (var i = 0; i < nums.length; i++) {
            var n = nums[i];
            if (n >= 1 && n <= 33) {
                var formatted = (n < 10 ? '0' : '') + n;
                if (red.indexOf(formatted) === -1) red.push(formatted);
                if (red.length >= 6) break;
            }
        }
        var blue = '';
        for (var j = 0; j < nums.length; j++) {
            var b = nums[j];
            if (b >= 1 && b <= 16) { blue = (b < 10 ? '0' : '') + b; break; }
        }
        if (red.length < 6) for (var k = red.length; k < 6; k++) red.push('0' + (k + 1));
        if (!blue) blue = '01';
        return { red: red.slice(0, 6), blue: blue };
    }

    // ========== 自动验证（多注） ==========
    async function autoVerify() {
        if (recognizedTickets.length === 0) { showToast('请先识别彩票'); return; }
        if (!currentResult.period || (detectedPeriod && currentResult.period !== detectedPeriod)) {
            await fetchResult(detectedPeriod);
        }

        // 隐藏单注结果卡片，使用多注汇总
        document.getElementById('resultCard').style.display = 'none';

        var results = [];
        var winCount = 0;

        for (var i = 0; i < recognizedTickets.length; i++) {
            var ticket = recognizedTickets[i];
            var result = checkWin(ticket.red, ticket.blue);
            result.ticketIndex = i + 1;
            results.push(result);
            if (result.level > 0) winCount++;
        }

        showMultiResult(results, winCount);
    }

    // ========== 多注验证结果展示 ==========
    function showMultiResult(results, winCount) {
        var summary = document.getElementById('verifySummary');
        var totalTickets = results.length;

        var html = '';
        html += '<div class="verify-summary-header">';
        html += '<div class="verify-summary-title">验证结果</div>';
        html += '<div class="verify-summary-stats">共 ' + totalTickets + ' 注 · <span class="win-count">' + winCount + ' 注中奖</span></div>';
        html += '</div>';

        html += '<div style="font-size:12px;color:#999;margin-bottom:8px;">验证期号：第 <span style="color:#e74c3c;font-weight:700;">' + currentResult.period + '</span> 期';
        if (detectedPeriod && detectedPeriod !== currentResult.period) {
            html += ' <span style="color:#bbb;">(识别: ' + detectedPeriod + ')</span>';
        }
        html += '</div>';

        // 开奖号码展示
        html += '<div style="margin-bottom:10px;">';
        html += '<div style="font-size:11px;color:#aaa;margin-bottom:4px;">开奖号码</div>';
        html += '<div class="ticket-balls" style="justify-content:center;">';
        currentResult.red.forEach(function(n) {
            html += '<div class="ball small red">' + n + '</div>';
        });
        html += '<div class="sep" style="color:#ccc;font-size:14px;margin:0 4px;">—</div>';
        html += '<div class="ball small blue">' + currentResult.blue + '</div>';
        html += '</div></div>';

        // 每注验证结果
        results.forEach(function(result) {
            var isWin = result.level > 0;
            html += '<div class="verify-ticket-result' + (isWin ? ' is-win' : '') + '">';
            html += '<div class="verify-ticket-header">';
            html += '<div class="verify-ticket-label">第' + result.ticketIndex + '注</div>';
            html += '<div class="verify-ticket-prize ' + (isWin ? 'win-prize' : 'lose-prize') + '">';
            if (isWin) {
                html += result.name + ' ' + result.money;
            } else {
                html += '未中奖';
            }
            html += '</div></div>';

            // 号码球
            html += '<div class="verify-ticket-balls">';
            result.red.forEach(function(n) {
                var isMatch = currentResult.red.indexOf(n) !== -1;
                html += '<div class="ball small red' + (isMatch ? ' highlight' : '') + '">' + n + '</div>';
            });
            html += '<div class="sep">—</div>';
            var bMatch = (result.blue === currentResult.blue);
            html += '<div class="ball small blue' + (bMatch ? ' highlight' : '') + '">' + result.blue + '</div>';
            html += '</div>';

            // 命中详情
            html += '<div class="verify-ticket-match">红球命中 <b>' + result.redMatch + '</b> 个 · 蓝球' + (result.blueMatch ? '<b>命中</b>' : '未命中') + '</div>';
            html += '</div>';
        });

        summary.innerHTML = html;
        summary.classList.add('show');
        summary.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ========== 手动输入验证 ==========
    async function verifyManual() {
        var redBalls = [];
        for (var i = 1; i <= 6; i++) {
            var el = document.getElementById('r' + i);
            var val = el.value.trim();
            if (val === '') { showToast('请输入第 ' + i + ' 个红球'); el.focus(); return; }
            var num = parseInt(val);
            if (isNaN(num) || num < 1 || num > 33) { showToast('红球范围 01-33'); el.focus(); return; }
            var formatted = (num < 10 ? '0' : '') + num;
            if (redBalls.indexOf(formatted) !== -1) { showToast('红球不能重复'); el.focus(); return; }
            redBalls.push(formatted);
        }
        var blueEl = document.getElementById('blue');
        var blueVal = blueEl.value.trim();
        if (blueVal === '') { showToast('请输入蓝球'); blueEl.focus(); return; }
        var blueNum = parseInt(blueVal);
        if (isNaN(blueNum) || blueNum < 1 || blueNum > 16) { showToast('蓝球范围 01-16'); blueEl.focus(); return; }
        var blueBall = (blueNum < 10 ? '0' : '') + blueNum;
        await fetchResult();
        var result = checkWin(redBalls, blueBall);
        showResult(result, 'manual', '');
    }

    // ========== 中奖判断 ==========
    function checkWin(red, blue) {
        var redMatch = 0;
        for (var j = 0; j < red.length; j++) {
            if (currentResult.red.indexOf(red[j]) !== -1) redMatch++;
        }
        var blueMatch = (blue === currentResult.blue);
        var level = 0, name = '未中奖', money = '';
        if (redMatch === 6 && blueMatch) { level = 1; name = '一等奖'; money = '最高1000万'; }
        else if (redMatch === 6) { level = 2; name = '二等奖'; money = '浮动奖金'; }
        else if (redMatch === 5 && blueMatch) { level = 3; name = '三等奖'; money = '3000元'; }
        else if (redMatch === 5 || (redMatch === 4 && blueMatch)) { level = 4; name = '四等奖'; money = '200元'; }
        else if (redMatch === 4 || (redMatch === 3 && blueMatch)) { level = 5; name = '五等奖'; money = '10元'; }
        else if (blueMatch) { level = 6; name = '六等奖'; money = '5元'; }
        return { level: level, name: name, money: money, redMatch: redMatch, blueMatch: blueMatch, red: red, blue: blue };
    }

    // ========== 号码球HTML ==========
    function ballsHtml(balls, blue, winRed, winBlue) {
        var h = '<div class="balls-row">';
        balls.forEach(function(n) {
            var isMatch = winRed.indexOf(n) !== -1;
            h += '<div class="ball small red' + (isMatch ? ' highlight' : '') + '">' + n + '</div>';
        });
        var bMatch = (blue === winBlue);
        h += '<div class="ball small blue' + (bMatch ? ' highlight' : '') + '">' + blue + '</div>';
        h += '</div>';
        return h;
    }

    // ========== 单注结果展示（手动输入用） ==========
    function showResult(result, source, periodDetected) {
        var cardId = (source === 'camera') ? 'resultCard' : 'resultCard2';
        var card = document.getElementById(cardId);
        card.style.display = 'block';
        card.className = 'result-card show ' + (result.level > 0 ? 'win' : 'lose');

        var html = '';
        if (source === 'camera' && periodDetected) {
            html += '<div class="result-period-info">验证期号：第 <span class="period-num">' + currentResult.period + '</span> 期';
            if (periodDetected !== currentResult.period) {
                html += ' <span style="color:#999;font-size:11px;">(识别: ' + periodDetected + ')</span>';
            }
            html += '</div>';
        } else {
            html += '<div class="result-period-info">验证期号：第 <span class="period-num">' + currentResult.period + '</span> 期</div>';
        }

        if (result.level > 0) {
            html += '<div class="result-icon">🏆</div>';
            html += '<div class="result-title" style="color:#e67e22;">' + result.name + '</div>';
            html += '<div class="result-money">' + result.money + '</div>';
        } else {
            html += '<div class="result-icon">😔</div>';
            html += '<div class="result-title" style="color:#999;">未中奖</div>';
        }
        html += '<div class="compare">';
        html += '<div class="compare-item"><div class="compare-label">您的号码</div>' + ballsHtml(result.red, result.blue, currentResult.red, currentResult.blue) + '</div>';
        html += '<div class="compare-item"><div class="compare-label">开奖号码</div>' + ballsHtml(currentResult.red, currentResult.blue, currentResult.red, currentResult.blue) + '</div>';
        html += '</div>';
        html += '<div class="result-detail">';
        html += '红球命中 <b>' + result.redMatch + '</b> 个 · 蓝球' + (result.blueMatch ? '命中 ✓' : '未命中 ✗');
        html += '</div>';
        card.innerHTML = html;
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ========== Toast提示 ==========
    function showToast(msg) {
        var toast = document.getElementById('toast') || (function() {
            var el = document.createElement('div');
            el.id = 'toast';
            el.className = 'toast';
            document.body.appendChild(el);
            return el;
        })();
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }

    // ========== 输入框自动跳转 ==========
    var inputs = ['r1','r2','r3','r4','r5','r6','blue'];
    inputs.forEach(function(id, idx) {
        document.getElementById(id).addEventListener('input', function() {
            if (this.value.length >= 2 && idx < inputs.length - 1) {
                document.getElementById(inputs[idx + 1]).focus();
            }
        });
    });

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', function() {
        renderHistory('historyResult');
        renderHistory('historyResult2');
        // 自动同步最新开奖数据
        syncLatestData();
    });
</script>
</body>
</html>
